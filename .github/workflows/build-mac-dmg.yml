name: Build Mac DMG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mac-dmg.yml"
      - "main-3004-isolated/**"
  workflow_dispatch:
    inputs:
      target:
        description: "选择要生成的 Mac 安装包"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - x64

permissions:
  contents: write
  actions: read

jobs:
  build-arm64:
    name: Build M系列-arm64
    if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'arm64' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: main-3004-isolated
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_electron_mirror: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-3004-isolated/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: node scripts/build-mac-installer.mjs --arch=arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: 共振画布V2.0-mac-M系列-arm64
          path: |
            main-3004-isolated/desktop-release-mac/*.dmg
            main-3004-isolated/desktop-release-mac/*.zip
          if-no-files-found: error

  publish-release:
    name: 发布 Mac DMG
    needs:
      - build-arm64
      - build-x64
    if: ${{ always() && !cancelled() && (needs.build-arm64.result == 'success' || needs.build-x64.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 共振画布V2.0-mac-*
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resonance-canvas-v2.0-mac-${{ github.run_number }}
          name: 共振画布 V2.0 Mac 安装包 ${{ github.run_number }}
          body: |
            Mac 一键安装版。

            - M 系列芯片下载 arm64
            - Intel 芯片下载 x64
          files: |
            release-artifacts/共振画布V2.0-mac-M系列-arm64/*
            release-artifacts/共振画布V2.0-mac-Intel-x64/*

  build-x64:
    name: Build Intel-x64
    if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'x64' }}
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: main-3004-isolated
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_electron_mirror: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-3004-isolated/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: node scripts/build-mac-installer.mjs --arch=x64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: 共振画布V2.0-mac-Intel-x64
          path: |
            main-3004-isolated/desktop-release-mac/*.dmg
            main-3004-isolated/desktop-release-mac/*.zip
          if-no-files-found: error
