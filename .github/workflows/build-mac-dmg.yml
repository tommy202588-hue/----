name: Build Mac DMG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mac-dmg.yml"
      - "main-3004-isolated/**"
  workflow_dispatch:
    inputs:
      target:
        description: "选择要生成的 Mac 安装包"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - arm64
          - x64

jobs:
  build-arm64:
    name: Build M系列-arm64
    if: ${{ inputs.target == 'both' || inputs.target == 'arm64' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: main-3004-isolated
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_electron_mirror: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-3004-isolated/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: node scripts/build-mac-installer.mjs --arch=arm64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: 共振画布V2.0-mac-M系列-arm64
          path: |
            main-3004-isolated/desktop-release-mac/*.dmg
            main-3004-isolated/desktop-release-mac/*.zip
          if-no-files-found: error

  build-x64:
    name: Build Intel-x64
    if: ${{ inputs.target == 'both' || inputs.target == 'x64' }}
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: main-3004-isolated
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_electron_mirror: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main-3004-isolated/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: node scripts/build-mac-installer.mjs --arch=x64

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: 共振画布V2.0-mac-Intel-x64
          path: |
            main-3004-isolated/desktop-release-mac/*.dmg
            main-3004-isolated/desktop-release-mac/*.zip
          if-no-files-found: error
